<!-- Search -->
<section class="bg-white rounded-lg shadow-sm border p-6 mb-6">
  <h2 class="text-xl font-semibold mb-4">Search Operations</h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
    <div>
      <label for="find-claim-id" class="block mb-2">Search by Claim ID</label>
      <input
        id="find-claim-id"
        type="text"
        placeholder="CLM-000001"
        class="w-full min-w-0 border rounded px-3 py-2"
      />
    </div>
    <div>
      <label for="find-clinician-id" class="block mb-2"
        >Search by Clinician ID</label
      >
      <input
        id="find-clinician-id"
        type="text"
        placeholder="CLN-000001"
        class="w-full min-w-0 border rounded px-3 py-2"
      />
    </div>
    <div>
      <label for="binary-search-claim-id" class="block mb-2"
        >Binary Search by Claim ID</label
      >
      <input
        id="binary-search-claim-id"
        type="text"
        placeholder="CLM-000001"
        class="w-full min-w-0 border rounded px-3 py-2"
      />
    </div>
  </div>
</section>
