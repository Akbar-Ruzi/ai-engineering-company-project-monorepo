    <!-- Collections -->
    <section class="bg-white rounded-lg shadow-sm border p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4">
        Collection Operations
      </h2>

      <section aria-labelledby="filter-claims-heading" class="mb-6">
        <h3 id="filter-claims-heading" class="text-lg font-semibold mb-3">Filter Claims</h3>
        <p class="text-gray-600 mb-4">Choose any combination of claim filters. All selected filters must match.</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
          <label for="claim-location" class="block">
            City
            <select id="claim-location" class="block w-full border rounded p-2 mt-1">
              <option value="">All cities</option>
            </select>
          </label>
          <label for="claim-status" class="block">
            Status
            <select id="claim-status" class="block w-full border rounded p-2 mt-1">
              <option value="">All statuses</option>
            </select>
          </label>
          <label for="claim-payer" class="block">
            Payer
            <select id="claim-payer" class="block w-full border rounded p-2 mt-1">
              <option value="">All payers</option>
            </select>
          </label>
          <label for="claim-service" class="block">
            Service type
            <select id="claim-service" class="block w-full border rounded p-2 mt-1">
              <option value="">All service types</option>
            </select>
          </label>
        </div>

        <div class="flex flex-wrap gap-3">
          <button id="filter-claims" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            Filter Claims
          </button>
          <button id="reset-filters" type="button"
            class="bg-gray-200 text-gray-900 px-4 py-2 rounded hover:bg-gray-300">
            Reset Filters
          </button>
        </div>
      </section>

      <div data-output-group class="grid grid-cols-1 md:grid-cols-3 gap-6 border-t pt-5 mb-6">
        <section aria-labelledby="filter-appointments-heading">
          <h3 id="filter-appointments-heading" class="text-lg font-semibold mb-3">Filter Appointments By Status</h3>
          <p class="text-gray-600 mb-4">Choose a status to find matching appointments.</p>
          <label for="appointment-status" class="block mb-4">
            Status
            <select id="appointment-status" class="block w-full max-w-xs border rounded p-2 mt-1">
              <option value="" disabled selected>Select a status</option>
              <option value="scheduled">Scheduled</option>
              <option value="confirmed">Confirmed</option>
              <option value="completed">Completed</option>
              <option value="no_show">No show</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </label>
        </section>

        <section aria-labelledby="sort-claims-heading">
          <h3 id="sort-claims-heading" class="text-lg font-semibold mb-3">Sort Claims By ID</h3>
          <div role="group" aria-label="Sort direction" class="flex gap-2">
            <button id="sort-claims-asc" type="button" aria-label="Sort claims ascending" title="Ascending"
              aria-pressed="false"
              class="border rounded px-4 py-2 text-xl hover:bg-blue-100 aria-pressed:bg-blue-600 aria-pressed:text-white">↑</button>
            <button id="sort-claims-desc" type="button" aria-label="Sort claims descending" title="Descending"
              aria-pressed="false"
              class="border rounded px-4 py-2 text-xl hover:bg-blue-100 aria-pressed:bg-blue-600 aria-pressed:text-white">↓</button>
          </div>
        </section>

        <section aria-labelledby="sort-appointments-heading">
          <h3 id="sort-appointments-heading" class="text-lg font-semibold mb-3">Sort Appointments By Date</h3>
          <div role="group" aria-label="Appointment sort direction" class="flex gap-2">
            <button id="sort-appointments-asc" type="button" aria-label="Sort appointments earliest first"
              title="Earliest first" aria-pressed="false"
              class="border rounded px-4 py-2 text-xl hover:bg-blue-100 aria-pressed:bg-blue-600 aria-pressed:text-white">&#8593;</button>
            <button id="sort-appointments-desc" type="button" aria-label="Sort appointments latest first"
              title="Latest first" aria-pressed="false"
              class="border rounded px-4 py-2 text-xl hover:bg-blue-100 aria-pressed:bg-blue-600 aria-pressed:text-white">&#8595;</button>
          </div>
        </section>

      </div>

      <section aria-labelledby="group-claims-heading" class="border-t pt-5">
        <h3 id="group-claims-heading" class="text-lg font-semibold mb-3">Group Claims</h3>
        <label for="claim-group-key" class="block mb-4">
          Group by
          <select id="claim-group-key" class="block w-full max-w-xs border rounded p-2 mt-1">
            <option value="" disabled selected>Select a grouping</option>
            <option value="locationId">Location</option>
            <option value="payerName">Payer</option>
            <option value="status">Status</option>
            <option value="serviceType">Service type</option>
          </select>
        </label>
      </section>
    </section>
